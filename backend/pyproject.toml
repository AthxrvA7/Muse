[project]
name = "muse-backend"
version = "0.1.0"
description = "Muse - mood-aware music curation API"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

# ---------- Ruff: linter + formatter ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP modern syntax,
# S bandit security checks, SIM simplifications, N naming
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain `assert` (S101), and tests use fake secrets on purpose (S105/S106).
# These security rules still apply to all app code.
"tests/**" = ["S101", "S105", "S106"]
