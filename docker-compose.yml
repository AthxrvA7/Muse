# Run all of Muse locally with one command:
#   docker compose up --build
# Then open http://127.0.0.1:8000/app/ (website) or http://127.0.0.1:8000/docs (API).
#
# Spotify credentials and TOKEN_ENCRYPTION_KEY are read from your .env (never committed).
# The database is a local MongoDB container, so no Atlas password is needed.
# Stop with Ctrl+C; `docker compose down -v` also deletes the local database.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No "ports:" on purpose: only the api container can reach the database
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: muse:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # reachable only from this computer
    env_file:
      - path: .env
        required: false # runs without Spotify when there is no .env (as in CI)
    environment:
      # These win over .env: always use the MongoDB container, never Atlas
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: muse
      POST_LOGIN_REDIRECT: /app/
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
